[package]
name = "coordinator"
description = "VaultMesh coordinator — the control plane: app registry, capability tokens, authoritative metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "coordinator"
path = "src/main.rs"

[dependencies]
vault-domain = { workspace = true }
vault-ports = { workspace = true }
vault-app = { workspace = true }
vault-proto = { workspace = true }
adapter-memstore = { workspace = true }
adapter-crypto = { workspace = true }
adapter-perimeter = { workspace = true }
adapter-rcgen-ca = { workspace = true }
adapter-ddns = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

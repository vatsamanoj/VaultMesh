name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build · test · lint · file-size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: File-size gate (<= 500 lines/file)
        run: ./scripts/check-file-size.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  domain-purity:
    name: vault-domain has no I/O deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert domain core imports no I/O crate
        run: |
          set -e
          manifest=crates/vault-domain/Cargo.toml
          if grep -Eiq 'tokio|sqlx|reqwest|axum|aws|hyper|rustfs' "$manifest"; then
            echo "vault-domain must not depend on I/O crates" >&2
            exit 1
          fi
          echo "vault-domain purity check passed."
